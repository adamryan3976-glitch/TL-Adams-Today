<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library Today</title>
<meta name="apple-mobile-web-app-title" content="Library Today">
<meta name="application-name" content="Library Today">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<style>
  html, body { margin:0; height:100%; background:#0d3a30; color:#fff;
    font:17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    padding:24px; box-sizing:border-box; text-align:center; }
  img { width:110px; height:110px; border-radius:25px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  h1 { margin:6px 0 0; font-size:24px; }
  p { margin:0; color:#cfe3dc; max-width:300px; }
  a { color:#ffd166; }
  #add { display:none; }
</style>
</head>
<body>
  <img src="apple-touch-icon.png" alt="">
  <h1>Library Today</h1>
  <p id="opening">Opening… <a id="go" href="#">tap here</a> if it doesn't.</p>
  <p id="add">Now tap <b>Share</b> → <b>Add to Home Screen</b>.<br>The icon will open your schedule.</p>
<script>
  // Your Apps Script web app URL
  var APP_URL = 'https://script.google.com/a/macros/ddsb.ca/s/AKfycbyitNoj-4-_AgBlfoJsOtrM5eDbOYErT7z5Zuht9UtCUQvxjHl0NVTw9VKfTHcPA3QBEw/exec';
  document.getElementById('go').href = APP_URL;

  if (/[?&]add\b/.test(location.search)) {
    // Setup mode: stay on this page and clean the address, so the
    // home-screen icon saves the plain link (which redirects).
    history.replaceState(null, '', location.pathname);
    document.getElementById('opening').style.display = 'none';
    document.getElementById('add').style.display = 'block';
  } else {
    location.replace(APP_URL);
  }
</script>
</body>
</html>
